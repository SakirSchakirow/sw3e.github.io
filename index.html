<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
    <a-assets>
        <img id="card"
             src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"/>
        <a-asset-item id="spModel"
                      src="./sp_rounded.glb"></a-asset-item>
        <a-asset-item id="w3Model"
                      src="./w3_rounded.glb"></a-asset-item>
        <a-asset-item id="w3eModel"
                      src="./w3e_rounded.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>

        <a-gltf-model
                src="#spModel"
                position="-1 0 -1"
                rotation="0 20 20"
                scale="1 1 1"
                animation__rotation="property: rotation; to: 0 -20 -20; dur: 4000; easing: easeInOutQuad; loop: true; dir: alternate;"
                animation__position="property: position; to: 1 1 1; dur: 9000; easing: easeInOutQuad; loop: true; dir: alternate;">
        </a-gltf-model>
        <a-gltf-model
                src="#w3Model"
                position="0 0 0"
                rotation="20 20 20"
                scale="1 1 1"
                animation__rotation="property: rotation; to: -20 -20 -20; dur: 3000; easing: easeInOutQuad; loop: true; dir: alternate;"
                animation__position="property: position; to: -2 -2 -2; dur: 10000; easing: easeInOutQuad; loop: true; dir: alternate;">
        </a-gltf-model>
        <a-gltf-model
                src="#w3eModel"
                position="1 1 1"
                rotation="20 0 20"
                scale="1 1 1"
                animation__rotation="property: rotation; to: -20 0 -20; dur: 5000; easing: easeInOutQuad; loop: true; dir: alternate;"
                animation__position="property: position; to: 2 2 2; dur: 7000; easing: easeInOutQuad; loop: true; dir: alternate;">
        </a-gltf-model>
    </a-entity>
</a-scene>
</body>
</html>
