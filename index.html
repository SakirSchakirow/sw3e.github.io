<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Mind AR -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- AR scene initializer and .mind file -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 0.01" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Video pathfile -->
        <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Логика привязки видео к маркеру (targetIndex: 0 означает первый маркер в файле) -->
      
        <!-- Отображение видео в плоскости. Размеры (width/height) можно менять под пропорции видео -->
        <a-video src="#ar-video" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      // Скрипт автоматического запуска видео при нахождении маркера камерой
      const targetEntity = document.querySelector('[mindar-image-target]');
      const video = document.querySelector('#ar-video');
      
      targetEntity.addEventListener("targetFound", event => {
        video.play();
      });
      
      targetEntity.addEventListener("targetLost", event => {
        video.pause();
      });
    </script>
  </body>
</html>
